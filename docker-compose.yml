services:

  postgres:
    image: postgres:18
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - nexus-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexus-db-network

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: nexus-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NexusDatabase: Host=postgres;Port=5432;Database=nexus;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Auth__ValidationUrl: http://auth:3000/internal/tokens/validate
      Auth__InternalApiKey: ${AUTH_INTERNAL_API_KEY}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__Exchange: nexus.telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-app-network
      - nexus-db-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexus-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.nexus-api.entrypoints=web"
      - "traefik.http.routers.nexus-api.priority=100"
      - "traefik.http.middlewares.nexus-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.nexus-api.middlewares=nexus-api-strip"
      - "traefik.http.services.nexus-api.loadbalancer.server.port=8080"

  auth:
    build:
      context: ./src/Auth
      dockerfile: Dockerfile
    container_name: nexus-auth
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexus_auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-app-network
      - nexus-db-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexus-auth-health.rule=Path(`/auth/health`) || Path(`/auth/health/database`)"
      - "traefik.http.routers.nexus-auth-health.entrypoints=web"
      - "traefik.http.routers.nexus-auth-health.priority=200"
      - "traefik.http.middlewares.nexus-auth-health-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.nexus-auth-health.middlewares=nexus-auth-health-strip"
      - "traefik.http.routers.nexus-auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.nexus-auth.entrypoints=web"
      - "traefik.http.routers.nexus-auth.priority=100"
      - "traefik.http.services.nexus-auth.loadbalancer.server.port=3000"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: nexus-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - nexus-rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexus-app-network

  telemetry-worker:
    build:
      context: .
      dockerfile: src/TelemetryWorker/Dockerfile
    container_name: nexus-telemetry-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__NexusDatabase: Host=postgres;Port=5432;Database=nexus;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__Exchange: nexus.telemetry
      RabbitMQ__InfrastructureQueue: nexus.telemetry.infrastructure
      RabbitMQ__SensorQueue: nexus.telemetry.sensor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexus-app-network
      - nexus-db-network

  traefik:
    image: traefik:v3.6.1
    container_name: nexus-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=nexus-app-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nexus-app-network
      - nexus-observability-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: nexus-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/nexus?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-db-network
      - nexus-observability-network

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: nexus-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
      - postgres-exporter
      - rabbitmq
      - traefik
    networks:
      - nexus-app-network
      - nexus-observability-network

  loki:
    image: grafana/loki:3.6.3
    container_name: nexus-loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./infrastructure/observability/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - nexus-observability-network

  tempo:
    image: grafana/tempo:2.9.0
    container_name: nexus-tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - nexus-observability-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: nexus-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./infrastructure/observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
    networks:
      - nexus-app-network
      - nexus-observability-network

  grafana:
    image: grafana/grafana:12.3.0
    container_name: nexus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - nexus-app-network
      - nexus-observability-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexus-grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.nexus-grafana.entrypoints=web"
      - "traefik.http.routers.nexus-grafana.priority=150"
      - "traefik.http.services.nexus-grafana.loadbalancer.server.port=3000"

networks:
  nexus-app-network:
    name: nexus-app-network
    driver: bridge

  nexus-db-network:
    name: nexus-db-network
    driver: bridge

  nexus-observability-network:
    name: nexus-observability-network
    driver: bridge

volumes:
  nexus-postgres-data:
    external: true

  nexus-rabbitmq-data:
    name: nexus-rabbitmq-data

  prometheus-data:
    name: nexus-prometheus-data

  grafana-data:
    name: nexus-grafana-data

  loki-data:
    name: nexus-loki-data

  tempo-data:
    name: nexus-tempo-data